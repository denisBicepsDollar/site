worker_processes 1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

  upstream api_backend {
    server api:3000;
    }

  server {
    listen 80;
    listen [::]:80;
    server_name zelenyeusy.ru www.zelenyeusy.ru admin.zelenyeusy.ru;

    location ^~ /.well-known/acme-challenge/ {
	root /var/www/certbot;
    }

    location / {
	return 301 https://$host$request_uri;
    }
  }
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zelenyeusy.ru www.zelenyeusy.ru;

    ssl_certificate     /etc/letsencrypt/live/zelenyeusy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zelenyeusy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    root /var/www/shop;
    index index.html;
    
    # Прокси для API
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
 
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
    root /var/www/shop;
    internal;
    }

    location ^~ /.well-known/acme-challenge/ {
	root /var/www/certbot;
    }
    # Блокируем сканеры
    location ~* \.(php|asp|aspx|jsp|cgi|py)$ {
        return 444;
    }

    location ~* /\.(env|git|svn|htaccess|htpasswd) {
        return 444;
    }

    location ~* /(composer\.json|package\.json|config\.json|settings\.py|phpinfo) {
        return 444;
    }


  }
  server {
      listen 443 ssl;
      listen [::]:443 ssl;
      server_name admin.zelenyeusy.ru;

      client_max_body_size 10m;

      ssl_certificate     /etc/letsencrypt/live/zelenyeusy.ru/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/zelenyeusy.ru/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers HIGH:!aNULL:!MD5;

      root /var/www/admin;
      index index.html;

      # Статика React — защищена паролем
      location / {
          auth_basic "Admin Area";
          auth_basic_user_file /etc/nginx/.htpasswd;
          try_files $uri $uri/ /index.html;
      }


      location /tables {
          auth_basic "Admin Area";
          auth_basic_user_file /etc/nginx/.htpasswd;
          proxy_pass http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /api/ {
          auth_basic "Admin Area";
          auth_basic_user_file /etc/nginx/.htpasswd;
          proxy_pass http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
  }
}
