worker_processes 1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;

  upstream api_backend { server api:3000; }

  server {
    listen 80;
    listen [::]:80;
    server_name zelenyeusy.ru www.zelenyeusy.ru;

    root /var/www/shop;
    index index.html;

    location ^~ /.well-know/acme-challenge/ {
	root /var/www/certbot;
    }

    location / {
	return 301 https://$host$request_uri;
    }
  }
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zelenyeusy.ru www.zelenyeusy.ru;

    ssl_certificate     /etc/letsencrypt/live/zelenyeusy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zelenyeusy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    root /var/www/shop;
    index index.html;
    
    # Прокси для API
    location /api/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
 
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html =404;
    }
    location ^~ /.well-known/acme-challenge/ {
	root /var/www/certbot;
    }
  }
  server {
      listen 443 ssl;
      listen [::]:443 ssl;
      server_name admin.zelenyeusy.ru;

      ssl_certificate     /etc/letsencrypt/live/zelenyeusy.ru/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/zelenyeusy.ru/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers HIGH:!aNULL:!MD5;

      root /var/www/admin;
      index index.html;

      # Статика React — защищена паролем
      location / {
          auth_basic "Admin Area";
          auth_basic_user_file /etc/nginx/.htpasswd;
          try_files $uri $uri/ /index.html;
      }

      # API для админки — без auth_basic (React сам передаёт заголовок)
      location /tables {
          proxy_pass http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
  }
}
