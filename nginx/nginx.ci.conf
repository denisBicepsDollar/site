worker_processes 1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

  upstream api_backend {
    server api:3000;
    }

  server {
    server_name localhost;
    set $server_type "public";
    
    root /var/www/shop;
    index index.html;
    
    # Прокси для API
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
 
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
    root /var/www/shop;
    internal;
    }

    location ^~ /.well-known/acme-challenge/ {
	root /var/www/certbot;
    }
    # Блокируем сканеры
    location ~* \.(php|asp|aspx|jsp|cgi|py)$ {
        return 444;
    }

    location ~* /\.(env|git|svn|htaccess|htpasswd) {
        return 444;
    }

    location ~* /(composer\.json|package\.json|config\.json|settings\.py|phpinfo) {
        return 444;
    }


  }
  server {
      server_name admin.localhost;
      set $server_type "admin";

      client_max_body_size 10m;

      root /var/www/admin;
      index index.html;

      # Статика React — защищена паролем
      location / {
          try_files $uri $uri/ /index.html;
      }


      location ^~ /admin/ {
          proxy_pass http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_set_header Cookie $http_cookie;
      }
      location /api/ {
          proxy_pass http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location ^~ /auth/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
  }
}
