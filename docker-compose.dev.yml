services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./shop:/var/www/shop
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./back/frontend/dist:/var/www/admin:ro

  api:
    environment:
      NODE_ENV: development
      CATALOG_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REPORTS_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/reports
      USERS_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/users
      SECRET_KEY: ${SECRET_KEY}


  certbot:
    profiles:
      - notstart

  worker:
    profiles:
      - notstart
    environment:
      NODE_ENV: development
