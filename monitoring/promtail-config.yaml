server:
  http_listen_port: 9090
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            output: log
      - output:
          source: output

      # 1. Парсим вложенный JSON для поиска сервиса
      - json:
          expressions:
            service: service
          source: output

      # 2. Вытаскиваем уровень строго из конструкции вида [20:51:25] INFO:
      - regex:
          expression: '^\[\d{2}:\d{2}:\d{2}\]\s+(?P<level>[A-Z]+):'
          source: output

      # 3. Делаем "умное" имя сервиса (сервис из JSON или имя контейнера)
      - template:
          source: service
          template: '{{if .service}}{{ .service}}{{ else }}{{ .container }}{{ end }}'

      # 4. Оставляем только белый список меток
      - labelallow:
          - container
          - service
          - service_name
          - level

      # 5. Превращаем переменные в официальные метки Loki
      - labels:
          service: service
          level: level


